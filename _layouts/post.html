---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  <p>{{ page.date | date: "%Y-%m-%d" }}</p>

  {% if page.tags %}
    <p>
      Tags:
      {% for tag in page.tags %}
        <a href="/?tag={{ tag }}">{{ tag }}</a>
      {% endfor %}
    </p>
  {% endif %}

  {{ content }}
</article>
